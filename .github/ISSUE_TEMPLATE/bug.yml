name: Bug report
description: Something is wrong or broken
labels: [bug]
body:
  - type: input
    id: where
    attributes: { label: Where, description: "Page / feature (e.g. Garden 3D, Site pack download)" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps, what you expected, what you got. Screenshots help." }
    validations: { required: true }
  - type: input
    id: site
    attributes: { label: Location & date, description: "Approximate lat/lon or town, and the date selected in the top bar (astronomy bugs depend on both)" }
  - type: input
    id: env
    attributes: { label: Browser / device }
